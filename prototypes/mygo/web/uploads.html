<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Clay Uploads — MyGo</title>
    <style>
      html, body, #mygo { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #211f1c; }
    </style>
    <script src="wasm_exec.js"></script>
  </head>
  <body>
    <div id="mygo"></div>
    <script>
      const go = new Go();
      WebAssembly.instantiateStreaming(fetch("app.wasm"), go.importObject)
        .then(({ instance }) => go.run(instance))
        .catch((error) => {
          document.body.textContent = "Clay Uploads could not start: " + error;
          document.body.style.cssText = "padding:24px;color:#fca5a5;font:14px system-ui";
        });
    </script>
  </body>
</html>
